name: 항공편 상태 갱신
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flight-status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 상태 받아 오기
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python3 scripts/fetch_status.py
      - name: 바뀌면 저장
        run: |
          if [ -n "$(git status --porcelain status.json)" ]; then
            git config user.name "flight-status-bot"
            git config user.email "actions@users.noreply.github.com"
            git add status.json
            git commit -m "항공편 상태 갱신"
            git pull --rebase origin main
            git push origin main
          fi
