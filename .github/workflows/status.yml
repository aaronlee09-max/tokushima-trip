name: 항공편 상태 갱신
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "버스·항공편을 지금 바로 조회(시험용)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: flight-status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 상태 받아 오기
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python3 scripts/fetch_status.py ${{ inputs.force && '--force' || '' }}
      - name: 8-1번 버스 위치 받아 오기
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/fetch_bus.py
      - name: 바뀌면 저장
        run: |
          if [ -n "$(git status --porcelain status.json bus_status.json)" ]; then
            git config user.name "flight-status-bot"
            git config user.email "actions@users.noreply.github.com"
            for f in status.json bus_status.json; do [ -e "$f" ] && git add "$f"; done
            git commit -m "항공편 상태 갱신"
            git pull --rebase origin main
            git push origin main
          fi
