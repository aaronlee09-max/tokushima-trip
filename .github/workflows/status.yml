name: 항공편·버스 상태 갱신
on:
  schedule:
    - cron: "7,37 * * * *"   # 반복 실행의 시작용. 밀려도 이어서 돌도록 한 번에 55분씩 돈다
  workflow_dispatch:
    inputs:
      force:
        description: "버스·항공편을 지금 바로 조회(시험용)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: flight-status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git 사용자 설정
        run: |
          git config user.name "flight-status-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: 55분 동안 5분마다 받아 오기
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
          FORCE: ${{ inputs.force }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: bash scripts/live_loop.sh
